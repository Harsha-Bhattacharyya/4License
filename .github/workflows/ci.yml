name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.2"

      - name: Install Node dependencies
        run: npm ci

      - name: Install Jekyll
        run: gem install jekyll webrick

      - name: Lint
        run: npm run lint

      - name: Format check
        run: npm run format:check

      - name: License drift check
        run: npm run license:check

      - name: Production build
        run: npm run build
